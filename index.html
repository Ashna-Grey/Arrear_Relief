<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বকেয়া ত্রাণ ক্যালকুলেটর – ধারা ১৫৭ (ফর্ম ৩৯)</title>
<meta name="description" content="আয়কর আইন ২০২৫-এর ধারা ১৫৭ (ফর্ম ৩৯) অনুযায়ী বকেয়া ত্রাণ হিসাব করার বিনামূল্যের ক্যালকুলেটর। / Free arrear relief calculator under Section 157 (Form 39).">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <p class="badge" data-i18n="badge"></p>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langBn" data-lang="bn">বাংলা</button>
        <button type="button" id="langEn" data-lang="en">English</button>
      </div>
    </div>
    <h1 data-i18n="title"></h1>
    <p class="lead" data-i18n="lead"></p>
  </div>
</header>

<main class="wrap">

  <section class="steps" aria-label="How it works">
    <div class="step"><span>1</span><p data-i18n="step1"></p></div>
    <div class="step"><span>2</span><p data-i18n="step2"></p></div>
    <div class="step"><span>3</span><p data-i18n="step3"></p></div>
  </section>

  <div class="layout">
    <div class="forms">

      <section class="card">
        <h2><span class="num">1</span> <span data-i18n="c1title"></span></h2>
        <p class="hint" data-i18n="c1hint"></p>
        <div class="grid2">
          <label class="field">
            <span class="lbl" data-i18n="f1l"></span>
            <input type="number" id="taxBefore" min="0" step="any" inputmode="decimal" placeholder="85000">
            <small data-i18n="f1s"></small>
          </label>
          <label class="field">
            <span class="lbl" data-i18n="f2l"></span>
            <input type="number" id="incomeBefore" min="0" step="any" inputmode="decimal" placeholder="1100000">
            <small data-i18n="f2s"></small>
          </label>
          <label class="field">
            <span class="lbl" data-i18n="f3l"></span>
            <input type="number" id="arrears" min="0" step="any" inputmode="decimal" placeholder="300000">
            <small data-i18n="f3s"></small>
          </label>
          <label class="field">
            <span class="lbl" data-i18n="f4l"></span>
            <input type="number" id="taxAfter" min="0" step="any" inputmode="decimal" placeholder="140000">
            <small data-i18n="f4s"></small>
          </label>
        </div>
        <div class="auto"><span data-i18n="auto"></span> <b id="incomeAfter">₹ 0</b></div>
      </section>

      <section class="card">
        <h2><span class="num">2</span> <span data-i18n="c2title"></span></h2>
        <p class="hint" data-i18n="c2hint"></p>
        <div id="yearRows"></div>
        <div class="row-actions">
          <button type="button" class="btn ghost" id="addYear" data-i18n="addYear"></button>
        </div>
        <div class="check" id="allocCheck" role="status"></div>
      </section>

      <div class="row-actions">
        <button type="button" class="btn ghost" id="resetBtn" data-i18n="reset"></button>
        <button type="button" class="btn ghost" id="printBtn" data-i18n="print"></button>
      </div>
    </div>

    <aside class="results">
      <section class="card result-card" aria-live="polite">
        <h2 data-i18n="rTitle"></h2>
        <div class="big" id="reliefBig">₹ 0</div>
        <p class="big-label" data-i18n="rBig"></p>
        <p class="msg" id="resultMsg"></p>
        <dl class="breakdown">
          <div><dt data-i18n="r1"></dt><dd id="rExtraReceipt">₹ 0</dd></div>
          <div><dt data-i18n="r2"></dt><dd id="rExtraEarlier">₹ 0</dd></div>
          <div class="hl"><dt data-i18n="r3"></dt><dd id="rRelief">₹ 0</dd></div>
          <div><dt data-i18n="r4"></dt><dd id="rNet">₹ 0</dd></div>
        </dl>
      </section>
    </aside>
  </div>

  <section class="glossary">
    <h2 data-i18n="gTitle"></h2>
    <div class="cards">
      <article class="gcard"><h3 data-i18n="g1t"></h3><p data-i18n="g1d"></p></article>
      <article class="gcard"><h3 data-i18n="g2t"></h3><p data-i18n="g2d"></p></article>
      <article class="gcard"><h3 data-i18n="g3t"></h3><p data-i18n="g3d"></p></article>
      <article class="gcard"><h3 data-i18n="g4t"></h3><p data-i18n="g4d"></p></article>
      <article class="gcard"><h3 data-i18n="g5t"></h3><p data-i18n="g5d"></p></article>
      <article class="gcard"><h3 data-i18n="g6t"></h3><p data-i18n="g6d"></p></article>
      <article class="gcard"><h3 data-i18n="g7t"></h3><p data-i18n="g7d"></p></article>
      <article class="gcard"><h3 data-i18n="g8t"></h3><p data-i18n="g8d"></p></article>
      <article class="gcard"><h3 data-i18n="g9t"></h3><p data-i18n="g9d"></p></article>
      <article class="gcard"><h3 data-i18n="g10t"></h3><p data-i18n="g10d"></p></article>
    </div>
  </section>

  <section class="notes">
    <h2 data-i18n="nTitle"></h2>
    <ul>
      <li data-i18n="n1"></li>
      <li data-i18n="n2"></li>
      <li data-i18n="n3"></li>
      <li data-i18n="n4"></li>
    </ul>
    <p class="disclaimer" data-i18n="disc"></p>
  </section>
</main>

<footer class="foot"><div class="wrap" data-i18n="foot"></div></footer>

<script src="script.js"></script>
</body>
</html>
